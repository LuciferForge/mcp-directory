name: Auto-Publish Weekly MCP Digest

on:
  schedule:
    # Run once per week: every Monday at 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regenerate weekly digest'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish-weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Fresh Weekly MCP Digest
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python blog_generator.py weekly --force
          else
            python blog_generator.py weekly
          fi

      - name: Rebuild Static Site & Sitemaps
        run: |
          python build_site.py

      - name: Commit & Push Generated Post
        run: |
          git config user.name 'Protodex Digest Engine'
          git config user.email 'digest@protodex.io'
          if [[ -n $(git status --porcelain docs/) ]]; then
            git add docs/
            git commit -m "feat(blog): publish weekly MCP server digest"
            git push origin master
          else
            echo "No new weekly content generated."
          fi
