name: Sync Gumroad Sales & Active Sponsors

on:
  schedule:
    # Run every 30 minutes 24/7 in GitHub cloud
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-sales:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Sales Tracker & Build Site if Changed
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          if [ -z "$GUMROAD_ACCESS_TOKEN" ]; then
            echo "::warning::GUMROAD_ACCESS_TOKEN secret is not set in GitHub repository settings. Skipping Gumroad sales sync."
            exit 0
          fi
          python track_sales.py --build-if-changed

      - name: Commit & Push Changes
        id: commit
        run: |
          git config user.name 'Protodex Sales Bot'
          git config user.email 'bot@protodex.io'
          if [[ -n $(git status --porcelain sales_ledger.json sponsored_servers.json docs/) ]]; then
            git add sales_ledger.json sponsored_servers.json docs/
            git commit -m "chore: auto-sync Gumroad sales and active sponsors [skip ci]"
            git push origin master
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No sales or sponsor changes detected."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    needs: sync-sales
    if: needs.sync-sales.outputs.pushed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
