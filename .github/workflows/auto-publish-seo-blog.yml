name: Auto-Publish Polymarket SEO Blog

on:
  schedule:
    # Run 3x per week: Monday, Wednesday, Friday at 06:00 UTC
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Generate Fresh Polymarket SEO Post
        run: |
          python polymarket_blog_generator.py

      - name: Rebuild Static Site & Sitemaps
        run: |
          python build_site.py

      - name: Commit & Push Generated Post
        id: commit
        run: |
          git config user.name 'Protodex SEO Engine'
          git config user.email 'seo@protodex.io'
          if [[ -n $(git status --porcelain docs/) ]]; then
            git add docs/
            git commit -m "feat(blog): publish autonomous polymarket prediction post [skip ci]"
            git push origin master
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new blog content generated."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    needs: publish-blog
    if: needs.publish-blog.outputs.pushed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
