name: Auto-Publish Polymarket SEO Blog

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Generate Fresh Polymarket SEO Post
        run: |
          python polymarket_blog_generator.py top-volume

      - name: Rebuild Static Site & Sitemaps
        run: |
          python build_site.py

      - name: Commit & Push Generated Post
        run: |
          git config user.name 'Protodex SEO Engine'
          git config user.email 'seo@protodex.io'
          if [[ -n $(git status --porcelain docs/) ]]; then
            git add docs/
            git commit -m "feat(blog): publish autonomous polymarket prediction post"
            git push origin master
          else
            echo "No new blog content generated."
          fi
