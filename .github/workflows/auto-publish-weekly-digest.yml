name: Auto-Publish Weekly MCP Digest

on:
  schedule:
    # Run once per week: every Monday at 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regenerate weekly digest'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish-weekly:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Fresh Weekly MCP Digest
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python blog_generator.py weekly --force
          else
            python blog_generator.py weekly
          fi

      - name: Rebuild Static Site & Sitemaps
        run: |
          python build_site.py

      - name: Commit & Push Generated Post
        id: commit
        run: |
          git config user.name 'Protodex Digest Engine'
          git config user.email 'digest@protodex.io'
          if [[ -n $(git status --porcelain docs/) ]]; then
            git add docs/
            git commit -m "feat(blog): publish weekly MCP server digest [skip ci]"
            git push origin master
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new weekly content generated."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    needs: publish-weekly
    if: needs.publish-weekly.outputs.pushed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
